name: Publish approved beta image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved beta version with a matching release record and OCI archive
        type: string
        required: true
        default: 0.1.0-beta.2
  push:
    branches: [codex/beta-image-release]
    paths: [.github/workflows/publish-beta-image.yaml]
permissions:
  contents: read
concurrency:
  group: cloud-visi-beta-image
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'cloud-visi/cloud-visi-deploy' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/beta-image-release')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version || '0.1.0-beta.2' }}
      IMAGE: ghcr.io/cloud-visi/cloud-visi
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download and verify the locally built runtime archive
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo "Invalid beta version" >&2; exit 1; }
          test -f "releases/$VERSION.json"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "cloud-visi-$VERSION.oci.tar" --dir "$RUNNER_TEMP"
          python3 scripts/verify-image-archive.py "$RUNNER_TEMP/cloud-visi-$VERSION.oci.tar" --record "releases/$VERSION.json"
      - name: Install official ORAS with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for file in oras_1.3.4_linux_amd64.tar.gz oras_1.3.4_checksums.txt; do
            curl --fail --location --retry 3 "https://github.com/oras-project/oras/releases/download/v1.3.4/$file" --output "$file"
          done
          grep ' oras_1.3.4_linux_amd64.tar.gz$' oras_1.3.4_checksums.txt | sha256sum --check
          tar -xzf oras_1.3.4_linux_amd64.tar.gz oras
          sudo install oras /usr/local/bin/oras
      - name: Publish the approved digest and beta alias
        shell: bash
        run: |
          set -euo pipefail
          digest=$(python3 -c 'import json, os; print(json.load(open("releases/" + os.environ["VERSION"] + ".json"))["image_digest"])')
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if gh api orgs/cloud-visi/packages/container/cloud-visi > "$RUNNER_TEMP/package.json" 2> "$RUNNER_TEMP/package-error.txt"; then
            if ! oras resolve "$IMAGE:$VERSION" > "$RUNNER_TEMP/existing-digest.txt" 2> "$RUNNER_TEMP/tag-error.txt"; then
              grep -Eiq '404|MANIFEST_UNKNOWN|not found' "$RUNNER_TEMP/tag-error.txt"
            else
              test "$(cat "$RUNNER_TEMP/existing-digest.txt")" = "$digest" || { echo 'An existing version has a different digest. Refusing to replace it.' >&2; exit 1; }
            fi
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/package-error.txt"
          fi
          oras cp --from-oci-layout "$RUNNER_TEMP/cloud-visi-$VERSION.oci.tar@$digest" "$IMAGE:$VERSION,beta"
          test "$(oras resolve "$IMAGE:$VERSION")" = "$digest"
          test "$(oras resolve "$IMAGE:beta")" = "$digest"
          printf 'Published `%s:%s` and `%s:beta` at `%s`.\n' "$IMAGE" "$VERSION" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
          gh api orgs/cloud-visi/packages/container/cloud-visi --jq '{name,visibility,html_url}'
  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, machine: x86_64}
          - {runner: ubuntu-24.04-arm, arch: arm64, machine: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version || '0.1.0-beta.2' }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify published image on native hardware with disposable data
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          digest=$(python3 -c 'import json, os; print(json.load(open("releases/" + os.environ["VERSION"] + ".json"))["image_digest"])')
          image="ghcr.io/cloud-visi/cloud-visi@$digest"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull --platform "linux/$EXPECTED_ARCH" "$image"
          trap 'docker rm -f cloud-visi-beta-app cloud-visi-beta-db >/dev/null 2>&1 || true; docker network rm cloud-visi-beta-check >/dev/null 2>&1 || true' EXIT
          docker network create cloud-visi-beta-check
          docker run -d --name cloud-visi-beta-db --network cloud-visi-beta-check \
            --env POSTGRES_USER=infra_timeline --env POSTGRES_DB=infra_timeline \
            --env POSTGRES_PASSWORD=local-beta-validation-only postgres:16.15-bookworm
          for attempt in $(seq 1 60); do
            if docker exec cloud-visi-beta-db pg_isready -h 127.0.0.1 -U infra_timeline -d infra_timeline >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec cloud-visi-beta-db pg_isready -h 127.0.0.1 -U infra_timeline -d infra_timeline
          export DATABASE_URL='postgres://infra_timeline:local-beta-validation-only@cloud-visi-beta-db:5432/infra_timeline?sslmode=disable'
          export SECRET_KEY=local-beta-validation-encryption-key
          docker run -d --name cloud-visi-beta-app --network cloud-visi-beta-check \
            --platform "linux/$EXPECTED_ARCH" --cap-drop ALL --security-opt no-new-privileges:true \
            --env DATABASE_URL --env SECRET_KEY \
            --env ADDR=127.0.0.1:8080 --env AUTH_PUBLIC_URL=http://127.0.0.1:8080 --env AUTH_DEV_HTTP=true "$image"
          ready=false
          for attempt in $(seq 1 120); do
            if docker exec cloud-visi-beta-app wget -q -O /dev/null http://127.0.0.1:8080/readyz; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          test "$(docker exec cloud-visi-beta-app id -u)" = 10001
          python3 scripts/smoke-image.py --container cloud-visi-beta-app --record "releases/$VERSION.json" --arch "$EXPECTED_ARCH"
          docker exec cloud-visi-beta-app sh -c 'mkdir -p /tmp/scanner-check && printf "%s\n" "resource \"aws_security_group\" \"example\" {" "  ingress {" "    from_port = 22" "    to_port = 22" "    protocol = \"tcp\"" "    cidr_blocks = [\"0.0.0.0/0\"]" "  }" "}" > /tmp/scanner-check/main.tf && trivy config --skip-check-update --skip-version-check --cache-dir /trivy-cache --format json --output /tmp/scanner-check/result.json /tmp/scanner-check'
          python3 - <<'PY'
          import json, subprocess
          scan = json.loads(subprocess.check_output(['docker', 'exec', 'cloud-visi-beta-app', 'cat', '/tmp/scanner-check/result.json']))
          findings = [f for r in scan.get('Results', []) for f in r.get('Misconfigurations', [])]
          assert findings, 'The bundled scanner did not identify the local sample issue'
          print('Bundled checks executed; sample findings:', len(findings))
          PY
          printf 'Native `%s` runtime, readiness, version, non-root user and bundled scanner passed.\n' "$EXPECTED_ARCH" >> "$GITHUB_STEP_SUMMARY"
