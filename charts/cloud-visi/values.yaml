# The beta image is published; the OCI chart remains on hold.
image:
  repository: ghcr.io/cloud-visi/cloud-visi
  tag: "" # Defaults to the chart appVersion.
  digest: "" # A digest takes precedence over the tag.
  pullPolicy: IfNotPresent
imagePullSecrets: []
fullnameOverride: ""
replicaCount: 1 # Multiple application writers are not supported.
secrets:
  existingSecret: cloud-visi-secrets
postgresql:
  enabled: true
  image: postgres:16.15-bookworm
  storage:
    size: 10Gi
    storageClass: ""
    existingClaim: ""
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
persistence:
  size: 5Gi
  storageClass: ""
  existingClaim: ""
service:
  port: 8080
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "2", memory: 2Gi}
config:
  pollInterval: 5m
  backfillDays: 30
serviceAccount:
  annotations: {}
  automountToken: false
extraEnv: [] # Optional workload identity environment variables. Never put secret values here.
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
ingress:
  enabled: false
  authenticationConfirmed: false # Require an existing authentication gateway.
  className: ""
  host: ""
  annotations: {}
  tls: []
startupProbe:
  failureThreshold: 60
  periodSeconds: 5
terminationGracePeriodSeconds: 30
