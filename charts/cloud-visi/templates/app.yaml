{{- if ne (int .Values.replicaCount) 1 }}{{ fail "Cloud-Visi requires exactly one application replica." }}{{ end }}
{{- $secret := required "Set secrets.existingSecret to an existing Kubernetes Secret." .Values.secrets.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-visi.name" . }}
  labels:
    {{- include "cloud-visi.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "cloud-visi.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: {{ include "cloud-visi.name" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cloud-visi
          image: {{ include "cloud-visi.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: DATABASE_URL}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: SECRET_KEY}
            - {name: AUTH_PUBLIC_URL, value: {{ required "Set config.authPublicURL to the exact HTTPS origin behind your TLS proxy." .Values.config.authPublicURL | quote }}}
            - {name: DATA_DIR, value: /data/repos}
            - {name: POLL_INTERVAL, value: {{ .Values.config.pollInterval | quote }}}
            - {name: BACKFILL_DAYS, value: {{ .Values.config.backfillDays | quote }}}
            {{- if .Values.trial.existingSecret }}
            - {name: TRIAL_LICENSE_FILE, value: /etc/cloud-visi/trial/license}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
            periodSeconds: 10
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: repositories, mountPath: /data/repos}
            {{- if .Values.trial.existingSecret }}
            - {name: trial-license, mountPath: /etc/cloud-visi/trial, readOnly: true}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: repositories
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-repositories" (include "cloud-visi.name" .)) .Values.persistence.existingClaim }}
        {{- if .Values.trial.existingSecret }}
        - name: trial-license
          secret:
            secretName: {{ .Values.trial.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ required "Set trial.key to the Secret's trial key field." .Values.trial.key | quote }}
                path: license
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
