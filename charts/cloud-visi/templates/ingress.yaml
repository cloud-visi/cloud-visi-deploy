{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.authenticationConfirmed }}{{ fail "Cloud-Visi has no built-in login. Configure an existing authentication gateway before enabling ingress, then set ingress.authenticationConfirmed=true." }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cloud-visi.name" . }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "Set ingress.host." .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cloud-visi.name" . }}
                port: {number: {{ .Values.service.port }}}
{{- end }}
